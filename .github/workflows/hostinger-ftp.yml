name: Įkelti į Hostinger (FTP)
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:
concurrency:
  group: hostinger-ftp
  cancel-in-progress: false
jobs:
  ikelti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Įkelti site/ į svetainės šaknį (lftp, su pakartojimais)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR || '.' }}
        run: |
          if [ -z "$FTP_SERVER" ]; then echo "FTP sekretų nėra – praleidžiu"; exit 0; fi
          sudo apt-get install -y -qq lftp >/dev/null
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-allow no;
            set net:timeout 30;
            set net:max-retries 8;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-max 30;
            set ftp:passive-mode yes;
            rm -r -f public_html;
            rm -f .ftp-deploy-sync-state.json;
            mirror -R --verbose=1 --parallel=2 --no-perms --exclude-glob CNAME --exclude-glob .nojekyll site/ $FTP_DIR/;
            bye"
          echo "Įkelta: $(find site -type f | wc -l) failų"
          echo "--- serveryje foto/h:"; lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "set ftp:ssl-allow no; cls -l $FTP_DIR/foto/h/; cls -l $FTP_DIR/index.html; bye" || true
          echo "--- gyvai:"; R=$RANDOM
          curl -sI "https://peterbravvo.lt/?v=$R" | grep -iE "^HTTP|last-modified|hcdn-cache" || true
          curl -s "https://peterbravvo.lt/?v=$R" | grep -o 'hero-foto[^>]*><img src="[^"]*"' | head -1 || true
          curl -s -o /dev/null -w "foto(nocache) %{http_code} %{content_type} %{size_download}\n" "https://peterbravvo.lt/foto/h/p19.webp?v=$R" || true
          curl -s -o /dev/null -w "foto %{http_code}\n" https://peterbravvo.lt/foto/h/p19.webp || true
