name: Įkelti į Hostinger (FTP)
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:
concurrency:
  group: hostinger-ftp
  cancel-in-progress: false
jobs:
  ikelti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Įkelti site/ į public_html (lftp, su pakartojimais)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR || 'public_html' }}
        run: |
          if [ -z "$FTP_SERVER" ]; then echo "FTP sekretų nėra – praleidžiu"; exit 0; fi
          sudo apt-get install -y -qq lftp >/dev/null
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-allow no;
            set net:timeout 30;
            set net:max-retries 8;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-max 30;
            set ftp:passive-mode yes;
            mirror -R --parallel=2 --no-perms --exclude-glob CNAME --exclude-glob .nojekyll site/ $FTP_DIR/;
            bye"
          echo "Įkelta: $(find site -type f | wc -l) failų"
