name: FTP aplankų sąrašas (diagnostika)
on: {workflow_dispatch: }
jobs:
  ls:
    runs-on: ubuntu-latest
    steps:
      - env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "set ftp:ssl-allow no; pwd; cls -1F; cls -1F domains/ ; cls -1F domains/*/ ; cls -1F domains/*/public_html/ | head -40; bye" || true
          echo "--- gyvas index:"; curl -s https://peterbravvo.lt/ | head -c 600; echo; curl -sI https://peterbravvo.lt/ | head -15
